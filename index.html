<!doctype html>
<html lang="en" class="dark" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <title>SecondMedic Diagnostics Network</title>
    <meta name="description" content="Integrated B2B diagnostics lab network operating system with role-based access for Managers, Staff, and Clients (including DSA), staff revenue attribution, audit logging, and central result verification." />
    <meta property="og:title" content="SecondMedic Diagnostics Network" />
    <meta property="og:description" content="Integrated B2B diagnostics lab network operating system with role-based access for Managers, Staff, and Clients (including DSA), staff revenue attribution, audit logging, and central result verification." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color-scheme: dark;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #020617;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .pulse-ring {
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 3px solid rgba(14, 165, 233, 0.2);
        border-radius: 50%;
        border-top-color: #0ea5e9;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500/30 selection:text-cyan-200" style="background-color: #020617; color: #f8fafc;">
    <div id="root">
      <div id="initial-loader">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #06b6d4); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px; box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.4);">
            +
          </div>
          <div>
            <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">
              Second<span style="color: #38bdf8;">Medic</span>
            </div>
            <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: #94a3b8; font-weight: 600;">
              Diagnostics Network
            </div>
          </div>
        </div>
        <div class="pulse-ring"></div>
        <div style="margin-top: 16px; font-size: 12px; color: #64748b; font-weight: 500;">
          Initializing secure lab portal...
        </div>
      </div>
    </div>
    <script>
      (function() {
        var timeoutId = setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader && document.getElementById('root') && document.getElementById('root').contains(loader)) {
            loader.innerHTML = '<div style="max-width: 440px; margin: 0 16px; padding: 28px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; text-align: center; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">' +
              '<div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.3); color: #38bdf8; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 22px;">⚙️</div>' +
              '<div style="font-size: 16px; font-weight: 700; color: #ffffff; margin-bottom: 8px;">GitHub Pages Deployment Notice</div>' +
              '<div style="font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; text-align: left;">' +
                'This Vite React application requires a build step. In your repository on GitHub:<br/><br/>' +
                '1. Go to <b>Settings &rarr; Pages</b><br/>' +
                '2. Under <i>Source</i>, select <b>GitHub Actions</b><br/>' +
                '3. Push changes or run the workflow in the <b>Actions</b> tab' +
              '</div>' +
              '<div style="display: flex; gap: 8px; justify-content: center;">' +
                '<button onclick="window.location.reload()" style="padding: 9px 18px; background: #0284c7; hover:background: #0369a1; color: #ffffff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">Refresh Portal</button>' +
              '</div>' +
            '</div>';
          }
        }, 5000);

        window.addEventListener('error', function(e) {
          console.error('Portal startup error:', e);
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
